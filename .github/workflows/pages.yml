# Test en publiceer de app op GitHub Pages bij elke push naar main.
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  testen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # De testbuild kent de publieke testsleutel; de privésleutel mag er niet in staan.
      - run: npx tsx scripts/controleer-build.ts dist-e2e

  bouwen:
    needs: testen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Bouwt met de publieke sleutels uit keys/publieke-sleutels.json. Nooit een privésleutel.
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  publiceren:
    needs: bouwen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publiceer.outputs.page_url }}student/
    steps:
      - id: publiceer
        uses: actions/deploy-pages@v5
